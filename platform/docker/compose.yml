# LocalVault 本番構成。
#   docker compose -f platform/docker/compose.yml --env-file platform/env/.env up -d
name: localvault

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    <<: *hardened
    image: postgres:16
    # initdb が chown/gosu を使うため必要最小限だけ戻す
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: localvault
      POSTGRES_DB: localvault
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localvault -d localvault"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    <<: *hardened
    image: localvault/server:latest
    build:
      context: ../..
      dockerfile: platform/docker/server.Dockerfile
    # 秘密ファイルは 0600（ホストのユーザー所有）なので同じ UID で動かす。
    user: "${LV_UID:-65532}:${LV_GID:-65532}"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      TOKEN_SECRET_FILE: /run/secrets/token_secret
      PRELOGIN_SECRET_FILE: /run/secrets/prelogin_secret
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN を platform/env/.env に設定してください}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "1"
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-true}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    secrets: [database_url, token_secret, prelogin_secret]
    networks: [edge, data]

  caddy:
    <<: *hardened
    image: caddy:2
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      app:
        condition: service_healthy
    environment:
      LV_DOMAIN: ${LV_DOMAIN:?LV_DOMAIN を platform/env/.env に設定してください}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  backup:
    <<: *hardened
    image: postgres:16
    entrypoint: ["/bin/bash", "/backup/backup.sh"]
    user: "${LV_UID:-65532}:${LV_GID:-65532}"
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-18}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
    secrets: [db_password, backup_passphrase]
    volumes:
      - ./backup/backup.sh:/backup/backup.sh:ro
      - ../backups:/backups
    networks: [data]

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  db_password:
    file: ../secrets/db_password
  database_url:
    file: ../secrets/database_url
  token_secret:
    file: ../secrets/token_secret
  prelogin_secret:
    file: ../secrets/prelogin_secret
  # 任意。空ファイルならバックアップは暗号化されない。
  # 暗号化する場合は .env の LV_BACKUP_PASSPHRASE_FILE にパスを設定する。
  backup_passphrase:
    file: ${LV_BACKUP_PASSPHRASE_FILE:-../secrets/.gitkeep}
