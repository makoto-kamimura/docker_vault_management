# LocalVault 開発用構成（自己完結。ここの秘密値は開発専用で、本番では絶対に使わない）。
#   フル起動:    docker compose -f platform/docker/compose.dev.yml up --build
#   DB だけ起動: docker compose -f platform/docker/compose.dev.yml up -d db
#     → サーバーはホストで DATABASE_URL=postgres://localvault:localvault@127.0.0.1:5432/localvault
name: localvault-dev

x-dev-env: &dev-env
  NODE_ENV: development
  DATABASE_URL: postgres://localvault:localvault@db:5432/localvault
  # DEV ONLY - 開発専用の固定値
  TOKEN_SECRET: dev-only-token-secret-0123456789abcdef0123456789abcdef
  PRELOGIN_SECRET: dev-only-prelogin-secret-0123456789abcdef0123456789
  PUBLIC_ORIGIN: https://localhost:8443
  REGISTRATION_MODE: open
  TRUST_PROXY: "1"
  LOG_LEVEL: debug

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: localvault
      POSTGRES_PASSWORD: localvault
      POSTGRES_DB: localvault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localvault -d localvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  # app と同じイメージ。app 側の build で作られる（--build 推奨）。
  migrate:
    image: localvault/server:dev
    pull_policy: never
    command: ["dist/cli.js", "migrate"]
    environment: *dev-env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    image: localvault/server:dev
    build:
      context: ../..
      dockerfile: platform/docker/server.Dockerfile
    read_only: true
    tmpfs: ["/tmp"]
    environment: *dev-env
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
    name: localvault-dev-pgdata
  caddy_data:
    name: localvault-dev-caddy-data
  caddy_config:
    name: localvault-dev-caddy-config
